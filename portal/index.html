<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>l0l0</title>
  <meta name="description" content="つくったものを、ひとつの場所に。" />
  <style>
    :root {
      --bg: #ffffff;
      --tile: #f5f5f7;
      --ink: #1d1d1f;
      --sub: #6e6e73;
      --link: #0066cc;
      --nav-h: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ---- nav ---- */
    .nav {
      position: sticky; top: 0; z-index: 50;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .nav .mark {
      font-size: 19px; font-weight: 600; letter-spacing: -0.02em;
      color: var(--ink); text-decoration: none;
    }

    /* ---- hero ---- */
    .hero {
      text-align: center;
      padding: clamp(56px, 11vw, 120px) 22px clamp(28px, 6vw, 56px);
    }
    .hero h1 {
      font-size: clamp(40px, 9vw, 88px);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.04;
    }
    .hero p {
      margin-top: clamp(10px, 2vw, 18px);
      font-size: clamp(19px, 3.4vw, 28px);
      font-weight: 500;
      color: var(--sub);
      letter-spacing: -0.01em;
    }

    /* ---- bento grid ---- */
    .grid {
      max-width: 1024px;
      margin: 0 auto;
      padding: 0 22px clamp(48px, 9vw, 96px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .grid .wide { grid-column: 1 / -1; }
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--tile);
      border-radius: 28px;
      padding: clamp(36px, 5vw, 52px) clamp(24px, 4vw, 44px) clamp(30px, 4vw, 44px);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform 0.25s ease;
    }
    .tile:hover { transform: scale(1.012); }
    .tile h2 {
      font-size: clamp(26px, 4.4vw, 40px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .tile .sub {
      margin-top: 8px;
      font-size: clamp(16px, 2.4vw, 21px);
      color: var(--sub);
      max-width: 34ch;
      letter-spacing: -0.01em;
    }
    .tile .host {
      margin-top: 6px;
      font-size: 13px;
      color: #a1a1a6;
      letter-spacing: 0;
    }
    .tile .links {
      margin-top: 18px;
      display: flex; gap: 26px; justify-content: center;
      font-size: clamp(16px, 2.2vw, 19px);
    }
    .tile .links a, .tile .links span { color: var(--link); text-decoration: none; }
    .tile .links a:hover { text-decoration: underline; }
    .tile .links .muted { color: #a1a1a6; }
    .chev::after { content: " \203A"; }

    .media {
      margin-top: clamp(26px, 4vw, 40px);
      width: 100%;
      height: clamp(150px, 26vw, 220px);
      border-radius: 20px;
      display: grid; place-items: center;
      font-size: clamp(56px, 11vw, 88px);
      line-height: 1;
    }
    .m-kikaku { background: linear-gradient(135deg, #e8f0ff, #eafff4); }
    .m-cost   { background: linear-gradient(135deg, #fff1e6, #ffe9ef); }
    .m-soon   { background: linear-gradient(135deg, #f0f0f3, #e9e9ee); }

    .tile.wide { padding-block: clamp(30px, 4vw, 40px); }
    .tile.wide .media { height: clamp(110px, 16vw, 150px); }

    footer {
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      color: #86868b;
      font-size: 12px;
      text-align: center;
      padding: 22px;
    }
  </style>
</head>
<body>
  <nav class="nav"><a class="mark" href="/">l0l0</a></nav>

  <header class="hero">
    <h1>l0l0</h1>
    <p>つくったものを、ひとつの場所に。</p>
  </header>

  <main class="grid">
    <a class="tile" href="https://kikakusho.l0l0.app">
      <h2>商品企画書・原価表</h2>
      <p class="sub">企画書から原価表まで、ひとつのアプリで。保存・自動計算・PDF / Excel / HTML 出力に対応。</p>
      <p class="host">kikakusho.l0l0.app</p>
      <div class="links"><span class="chev">ひらく</span></div>
      <div class="media m-kikaku">📊</div>
    </a>

    <a class="tile" href="https://cost-planter.jp">
      <h2>cost-planter</h2>
      <p class="sub">原価計算ツール。</p>
      <p class="host">cost-planter.jp</p>
      <div class="links"><span class="chev">ひらく</span></div>
      <div class="media m-cost">🧮</div>
    </a>

    <div class="tile wide" aria-disabled="true">
      <h2>近日追加</h2>
      <p class="sub">新しいアプリ・サイトをここに追加していきます。</p>
      <div class="links"><span class="muted">準備中</span></div>
      <div class="media m-soon">✨</div>
    </div>
  </main>

  <footer>Copyright © 2026 l0l0. All rights reserved.</footer>
</body>
</html>
