<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>l0l0</title>
  <meta name="description" content="つくったものを、ひとつの場所に。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --tile: #f5f5f7;
      --ink: #1d1d1f;
      --sub: #6e6e73;
      --faint: #a1a1a6;
      --line: rgba(0, 0, 0, 0.08);
      --link: #0066cc;
      --nav-h: 52px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "palt" 1;
    }

    /* ---------- nav ---------- */
    .nav {
      position: sticky; top: 0; z-index: 50;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .nav .mark {
      font-size: 18px; font-weight: 600; letter-spacing: 0.04em;
      color: var(--ink); text-decoration: none;
    }

    /* ---------- hero ---------- */
    .hero {
      text-align: center;
      padding: clamp(64px, 12vw, 132px) 22px clamp(36px, 7vw, 68px);
    }
    .hero .eyebrow {
      font-size: 13px; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--faint);
      margin-bottom: clamp(14px, 3vw, 22px);
    }
    .hero h1 {
      font-size: clamp(46px, 9.5vw, 92px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.02;
    }
    .hero p {
      margin-top: clamp(12px, 2.2vw, 20px);
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 500;
      color: var(--sub);
      letter-spacing: 0.005em;
    }

    /* ---------- grid ---------- */
    .grid {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 22px clamp(56px, 10vw, 104px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .grid .wide { grid-column: 1 / -1; }
    }

    .tile {
      display: flex;
      flex-direction: column;
      background: var(--tile);
      border: 1px solid transparent;
      border-radius: 24px;
      padding: clamp(28px, 3.6vw, 40px);
      text-decoration: none;
      color: inherit;
      transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.2, 1),
                  box-shadow 0.28s ease, background 0.28s ease;
    }
    a.tile:hover {
      transform: translateY(-4px);
      background: #fff;
      border-color: var(--line);
      box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.18);
    }

    .ic {
      width: 56px; height: 56px;
      display: grid; place-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.18);
      margin-bottom: clamp(20px, 3vw, 28px);
    }
    .ic svg { width: 26px; height: 26px; }
    .ic.blue  { color: #0066cc; }
    .ic.amber { color: #b4530c; }
    .ic.gray  { color: #8a8a8e; }

    .tile h2 {
      font-size: clamp(21px, 2.8vw, 26px);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.25;
    }
    .tile .sub {
      margin-top: 9px;
      font-size: clamp(14px, 1.9vw, 16px);
      line-height: 1.65;
      color: var(--sub);
      max-width: 40ch;
    }

    .meta {
      margin-top: clamp(22px, 3vw, 30px);
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .meta .host {
      font-size: 13px; color: var(--faint);
      letter-spacing: 0.01em;
    }
    .meta .open {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 15px; font-weight: 500; color: var(--link);
      white-space: nowrap;
    }
    .meta .open svg { width: 16px; height: 16px; transition: transform 0.25s ease; }
    a.tile:hover .meta .open svg { transform: translateX(3px); }
    .meta .open.muted { color: var(--faint); }

    .wide { flex-direction: row; align-items: center; gap: clamp(20px, 4vw, 32px); }
    .wide .ic { margin-bottom: 0; flex: none; }
    .wide .body { flex: 1; }
    .wide .meta { display: none; }
    .wide .badge {
      font-size: 13px; font-weight: 500; color: var(--faint);
      white-space: nowrap;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
      text-align: center;
      padding: 24px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <nav class="nav"><a class="mark" href="/">l0l0</a></nav>

  <header class="hero">
    <div class="eyebrow">Products</div>
    <h1>l0l0</h1>
    <p>つくったものを、ひとつの場所に。</p>
  </header>

  <main class="grid">
    <!-- kikakusho -->
    <a class="tile" href="https://kikakusho.l0l0.app">
      <div class="ic blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/>
        </svg>
      </div>
      <h2>商品企画書・原価表</h2>
      <p class="sub">企画書から原価表まで、ひとつのアプリで。保存・自動計算・PDF / Excel / HTML 出力に対応。</p>
      <div class="meta">
        <span class="host">kikakusho.l0l0.app</span>
        <span class="open">ひらく
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </span>
      </div>
    </a>

    <!-- cost-planter -->
    <a class="tile" href="https://cost-planter.jp">
      <div class="ic amber" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2"/>
          <path d="M8 6h8"/>
          <path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/>
          <path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14v4"/>
          <path d="M8 18h.01"/><path d="M12 18h.01"/>
        </svg>
      </div>
      <h2>cost-planter</h2>
      <p class="sub">原価計算ツール。</p>
      <div class="meta">
        <span class="host">cost-planter.jp</span>
        <span class="open">ひらく
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </span>
      </div>
    </a>

    <!-- coming soon -->
    <div class="tile wide" aria-disabled="true">
      <div class="ic gray" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14"/><path d="M5 12h14"/>
        </svg>
      </div>
      <div class="body">
        <h2>近日追加</h2>
        <p class="sub">新しいアプリ・サイトをここに追加していきます。</p>
      </div>
      <span class="badge">準備中</span>
    </div>
  </main>

  <footer>Copyright © 2026 l0l0. All rights reserved.</footer>
</body>
</html>
